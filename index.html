<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Championship Registration Form</title>
</head>
<body>

    <!-- * Coded by Nymul -->


     <h2>School Championship Registration Form</h2>
    <form action="">
        <label for="">School Name</label>
        <input type="text" placeholder="Enter Your School Name" required>
        <br><br>
        <label for="">Schooler Name</label>
        <input type="text" placeholder="Enter Your First Name"required>
        <input type="text" placeholder="Enter Your Last Name"required>

        <br><br>

        <label for="Gender">Gender</label>
        <br>
        <label for="Male">Male</label>
        <input name="gender" id="Male" type="radio">
        <label for="Female">Female</label>
        <input name="gender" id="Female" type="radio">

        <br><br>

        <h3>Gurdian's Info</h3>

        <label for="">Parent Name</label>
        <input type="text" placeholder="Enter Your First Name"required>
        <input type="text" placeholder="Enter Your Last Name"required>

        <br><br>

        <label for="">Parent Phone</label>
        <input type="number" placeholder="Enter Your Phone Number"required>
        <br><br>
        <label for="">Parent Email</label>
        <input type="email" placeholder="Enter Your Email Adress"required>

        <br><br><br><br>

        <h3>Prefered Sport</h3>

        <input id="Football" type="checkbox">
        <label for="Football">Football</label>
        
        <input id="Badminton" type="checkbox">
        <label for="Badminton">Badminton</label>
        
        <input id="Cricket" type="checkbox">
        <label for="Cricket">Cricket</label>

        <br><br><br>


    <label for="">Submitting Date</label>
     <input type="datetime-local"required>
     <br><br>
     <label for="">Students Photo</label>
     <input type="file"required>
     <br><br>
     <label for="">Students Password</label>
     <input type="password"required>
     <br><br>
     <label for="">Students favourite Color</label>
     <input type="color">

     <br><br><br><br>

     <button type="submit">submit</button>

        
        

    </form>
    

    <!-- * Coded by Nymul -->

</body>
</html>
